# Builds the program and runs the tests on every push and pull request.
# (A version tag makes a release: release.yml.)
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build CncController.slnx -c Release

      - name: Test
        run: dotnet test CncController.slnx -c Release --no-build
